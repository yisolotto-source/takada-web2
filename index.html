<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高田翔真のホームページ</title>
  <style>
    /* 阿部寛風デザインの再現 */
    body {
      background-color: #c0c0c0; /* クラシックなグレー背景 */
      font-family: "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
      margin: 0;
      padding: 0;
    }
    
    /* 2カラム（左メニュー・右メイン）レイアウト */
    .container {
      display: flex;
      min-height: 100vh;
    }

    /* 左側サイドバー */
    .sidebar {
      width: 180px;
      background-color: #dcdcdc;
      border-right: 2px solid #808080;
      padding: 15px 10px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      font-size: 16px;
      margin-top: 0;
      border-bottom: 1px solid #000;
    }

    .sidebar ul {
      list-style-type: square;
      padding-left: 20px;
      margin: 0;
    }

    .sidebar li {
      margin-bottom: 10px;
    }

    .sidebar a {
      color: #0000ff; /* 昔ながらの青色リンク */
      font-size: 14px;
    }

    /* 右側メインエリア */
    .main {
      flex: 1;
      padding: 20px;
      background-color: #ffffff;
    }

    h1 {
      font-size: 24px;
      color: #000080;
      border-bottom: 2px solid #000080;
      padding-bottom: 5px;
    }

    .profile-box {
      margin-bottom: 20px;
    }

    .profile-box img {
      width: 150px;
      border: 1px solid #000;
      margin-bottom: 10px;
    }

    table {
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #808080;
      padding: 6px 10px;
      font-size: 14px;
      text-align: left;
    }

    th {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 左側メニュー -->
    <nav class="sidebar">
      <h2>メニュー</h2>
      <ul>
        <li><a href="#top">トップ</a></li>
        <li><a href="#profile">プロフィール</a></li>
        <li><a href="#news">最新情報</a></li>
        <li><a href="#contact">連絡先</a></li>
      </ul>
    </nav>

    <!-- 右側メインコンテンツ -->
    <main class="main">
      <h1>高田翔真のホームページ</h1>
      
      <section id="profile" class="profile-box">
        <!-- 写真画像があれば img タグの src を指定 -->
        <img src="profile.JPG" alt="本人写真">
        
        <table>
          <tr>
            <th>名前</th>
            <td>高田 翔真（タカダ ショウマ）</td>
          </tr>
          <tr>
            <th>生年月日</th>
            <td>2001年2月14日</td>
          </tr>
          <tr>
            <th>職業</th>
            <td>理学療法士</td>
          </tr>
          <tr>
            <th>趣味</th>
            <td>サウナ、ラーメン、犬遊び</td>
          </tr>
        </table>
      </section>

      <section id="news">
        <h2>最新情報</h2>
        <ul>
          <li>2026/05/18：結婚いたしました。</li>
          <li>2023/03/11：大学を卒業しました。</li>
          <li>2019/03/14：高校を卒業しました。</li>
          <li>2018/06/09：関東大会に出場いたしました。</li>
          <li>2016/07/10：麦わら帽子を被りました。</li>
          <li>2016/04/04：高校に入学しました。</li>
        </ul>
      </section>
    </main>
  </div>

</body>
</html>
